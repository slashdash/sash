[package]
name = "sash"
version = "0.1.0"
edition = "2024"
description = "A Quake-style drop-down terminal for macOS, built with Rune and libghostty-vt"
license = "MIT"
repository = "https://github.com/slashdash/sash"
homepage = "https://github.com/slashdash/sash"
readme = "README.md"
rust-version = "1.85"
keywords = ["terminal", "quake", "dropdown", "macos", "ghostty"]
categories = ["command-line-interface", "gui"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
portable-pty = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSPanel", "NSScreen", "NSWindow"] }

[build-dependencies]
bindgen = "0.73"

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
winit = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
